name: SVASA quality audit
on:
  push:
    branches: [main]
    paths: ['package-lock.json','package.json','vercel.json','frontend/**', 'backend/**', 'tests/**', '.github/workflows/quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install Lighthouse
        run: npm install --no-save --package-lock=false lighthouse@13.6.0
      - name: Collect local mobile and desktop audits
        run: |
          mkdir -p quality-artifacts
          node backend/server.js > /tmp/svasa-quality.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:8080/api/health
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_PATH"
          for page in index app; do
            for mode in mobile desktop; do
              EXTRA=""
              if [ "$mode" = desktop ]; then EXTRA="--preset=desktop"; fi
              OUTPUT="quality-artifacts/$page-$mode.json"
              for attempt in 1 2 3; do
                rm -f "$OUTPUT"
                if npx --no-install lighthouse "http://localhost:8080/$page.html" $EXTRA --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="$OUTPUT" --quiet; then
                  if node -e 'const r=require("./"+process.argv[1]);process.exit(r.runtimeError?1:0)' "$OUTPUT"; then break; fi
                fi
                if [ "$attempt" = 3 ]; then echo "Audit did not produce a valid trace"; exit 1; fi
                echo "Retrying invalid audit trace (not a score-based retry): $page $mode"
                sleep 2
              done
            done
          done
          node -e "const fs=require('fs');for(const f of fs.readdirSync('quality-artifacts').filter(x=>x.endsWith('.json'))){const j=JSON.parse(fs.readFileSync('quality-artifacts/'+f));console.log('Task attribution',JSON.stringify({longTasks:j.audits['long-tasks']?.details?.items?.slice(0,8),mainThread:j.audits['mainthread-work-breakdown']?.details?.items?.slice(0,8)}));console.log('Metrics',JSON.stringify(Object.fromEntries(['first-contentful-paint','largest-contentful-paint','speed-index','total-blocking-time','cumulative-layout-shift'].map(k=>[k,j.audits[k]?.numericValue]))));if(j.runtimeError)throw Error(j.runtimeError.message);console.log(f,JSON.stringify(Object.fromEntries(Object.entries(j.categories).map(([k,v])=>[k,Math.round(v.score*100)]))));console.log('Diagnostics',JSON.stringify(Object.values(j.audits).filter(a=>a.score!==null&&a.score<0.9).map(a=>({id:a.id,score:a.score,displayValue:a.displayValue})).slice(0,25)))}" | tee quality-artifacts/scores.txt
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svasa-lighthouse
          path: quality-artifacts/
          if-no-files-found: ignore
