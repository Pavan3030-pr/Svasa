name: SVASA production smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package-lock.json','package.json','vercel.json','backend/**', 'api/**', 'frontend/**', 'tests/production-smoke.js', '.github/workflows/production.yml','scripts/wait-deployment.js']
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Wait for stable deployed commit
        run: node scripts/wait-deployment.js
      - name: Verify deployed public endpoints and assistant resilience
        run: node tests/production-smoke.js
      - name: Confirm exact build after smoke checks
        run: node scripts/wait-deployment.js
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svasa-production-smoke
          path: production-artifacts/
          if-no-files-found: ignore
