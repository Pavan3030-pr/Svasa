name: SVASA independent station observation
on:
  push:
    branches: [main]
    paths: ['scripts/station-observation.js', 'backend/lib/openaq.js', '.github/workflows/station-observation.yml']
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: svasa-station-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Wait for exact production build on push
        if: github.event_name == 'push'
        run: node scripts/wait-deployment.js
      - name: Compare public station and model samples
        run: node scripts/station-observation.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-observation
          path: station-observation-artifacts/
          retention-days: 30
