name: SVASA real production browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**','backend/**','api/**','tests/production-browser.js','.github/workflows/production-browser.yml']
permissions:
  contents: read
jobs:
  user-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: npx playwright install --with-deps chromium
      - name: Wait for exact deployed build
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS https://svasa-sage.vercel.app/api/health | grep -q "$GITHUB_SHA"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Real user journey (no provider mocks)
        run: node tests/production-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-user-journey
          path: production-browser-artifacts/
          if-no-files-found: ignore
