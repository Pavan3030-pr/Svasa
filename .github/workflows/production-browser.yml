name: SVASA real production browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package-lock.json','package.json','vercel.json','frontend/**','backend/**','api/**','tests/production-browser.js','.github/workflows/production-browser.yml','scripts/wait-deployment.js']
permissions:
  contents: read
jobs:
  user-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: npx playwright install --with-deps chromium
      - name: Wait for exact deployed build
        run: node scripts/wait-deployment.js
      - name: Real user journey (no provider mocks)
        run: node tests/production-browser.js
      - name: Confirm exact build after browser journey
        run: node scripts/wait-deployment.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-user-journey
          path: production-browser-artifacts/
          if-no-files-found: ignore
