name: SVASA checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install locked runtime dependencies
        run: npm ci --omit=dev --ignore-scripts --no-fund
      - name: Runtime dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked text for accidental secrets
        run: npm run security:secrets
      - name: JavaScript syntax
        run: find frontend backend api tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Unit and mocked integration tests
        run: npm test
      - name: Local HTTP smoke check
        run: |
          node backend/server.js > /tmp/svasa.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ > /tmp/landing.html
          curl -fsS http://localhost:8080/app.html > /tmp/app.html
          grep -q 'Svasa' /tmp/landing.html
          grep -q 'optimizeday' /tmp/app.html

      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.65.1 axe-core@4.14.1
          npx playwright install --with-deps chromium
      - name: Desktop and mobile browser flows
        run: |
          node backend/server.js > /tmp/svasa-browser.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://localhost:8080/api/health
          node tests/browser.test.js
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svasa-browser-screenshots
          path: test-artifacts/
          if-no-files-found: ignore

  publish-gallery:
    name: Publish verified README screenshots
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/download-artifact@v4
        with:
          name: svasa-browser-screenshots
          path: gallery-artifacts
      - name: Update only README gallery and validated PNG assets
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Main advanced; skipping stale screenshot publication."
            exit 0
          fi
          node scripts/publish-gallery.js "$GITHUB_SHA" "$GITHUB_RUN_ID" gallery-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs/screenshots/current/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh verified application screenshot gallery [skip ci]"
          git push origin HEAD:main
